<div class="admin-section">
  <h2 class="section-title">Manage Contact Information</h2>

  <div
    class="message"
    *ngIf="message"
    [class.success]="messageType === 'success'"
    [class.error]="messageType === 'error'"
  >
    {{ message }}
  </div>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="admin-form">
    <h3 class="form-section-title">Basic Information</h3>

    <div class="form-row">
      <div class="form-group">
        <label>Email *</label>
        <input type="email" formControlName="email" placeholder="your@email.com" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" formControlName="phone" placeholder="+1 234 567 8900" />
      </div>
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" formControlName="address" placeholder="City, Country" />
    </div>

    <h3 class="form-section-title">Social Links</h3>

    <div class="form-row">
      <div class="form-group">
        <label> <i class="fab fa-linkedin"></i> LinkedIn </label>
        <input type="url" formControlName="linkedin" placeholder="https://linkedin.com/in/..." />
      </div>
      <div class="form-group">
        <label> <i class="fab fa-github"></i> GitHub </label>
        <input type="url" formControlName="github" placeholder="https://github.com/..." />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label> <i class="fab fa-twitter"></i> Twitter </label>
        <input type="url" formControlName="twitter" placeholder="https://twitter.com/..." />
      </div>
      <div class="form-group">
        <label> <i class="fab fa-facebook"></i> Facebook </label>
        <input type="url" formControlName="facebook" placeholder="https://facebook.com/..." />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label> <i class="fab fa-instagram"></i> Instagram </label>
        <input type="url" formControlName="instagram" placeholder="https://instagram.com/..." />
      </div>
      <div class="form-group">
        <label> <i class="fas fa-globe"></i> Website </label>
        <input type="url" formControlName="website" placeholder="https://yourwebsite.com" />
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="contactForm.invalid || isLoading">
        Save Contact Information
      </button>
    </div>
  </form>
</div>
