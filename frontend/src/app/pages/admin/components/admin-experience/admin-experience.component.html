<div class="admin-section">
  <h2 class="section-title">Manage Experience</h2>

  <div
    class="message"
    *ngIf="message"
    [class.success]="messageType === 'success'"
    [class.error]="messageType === 'error'"
  >
    {{ message }}
  </div>

  <form [formGroup]="experienceForm" (ngSubmit)="onSubmit()" class="admin-form">
    <div class="form-row">
      <div class="form-group">
        <label>Job Title *</label>
        <input type="text" formControlName="title" placeholder="e.g., Senior Developer" />
      </div>
      <div class="form-group">
        <label>Company *</label>
        <input type="text" formControlName="company" placeholder="e.g., Tech Corp" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Location</label>
        <input type="text" formControlName="location" placeholder="e.g., New York, NY" />
      </div>
      <div class="form-group">
        <label>Order</label>
        <input type="number" formControlName="order" placeholder="0" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Start Date *</label>
        <input type="text" formControlName="startDate" placeholder="e.g., Jan 2020" />
      </div>
      <div class="form-group">
        <label>End Date</label>
        <input type="text" formControlName="endDate" placeholder="e.g., Dec 2023" />
      </div>
    </div>

    <div class="form-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="current" />
        <span>Currently working here</span>
      </label>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea
        formControlName="description"
        rows="4"
        placeholder="Brief description of your role..."
      ></textarea>
    </div>

    <div class="form-group">
      <label>Responsibilities</label>
      <div class="array-items">
        <div class="array-item" *ngFor="let resp of responsibilities.controls; let i = index">
          <input type="text" [formControl]="$any(resp)" placeholder="Responsibility" />
          <button type="button" class="btn-icon btn-remove" (click)="removeResponsibility(i)">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
      <button type="button" class="btn btn-small btn-secondary" (click)="addResponsibility()">
        <i class="fas fa-plus"></i> Add Responsibility
      </button>
    </div>

    <div class="form-group">
      <label>Technologies (comma-separated)</label>
      <input
        type="text"
        formControlName="technologies"
        placeholder="e.g., Angular, Node.js, MongoDB"
      />
    </div>

    <div class="form-actions">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="experienceForm.invalid || isLoading"
      >
        {{ isEditing ? 'Update' : 'Add' }} Experience
      </button>
      <button type="button" class="btn btn-secondary" *ngIf="isEditing" (click)="resetForm()">
        Cancel
      </button>
    </div>
  </form>

  <div class="items-list">
    <h3>Experience List</h3>
    <div class="item-card" *ngFor="let exp of experienceList">
      <div class="item-content">
        <h4>{{ exp.title }}</h4>
        <p class="item-subtitle">{{ exp.company }}</p>
        <p class="item-meta">{{ exp.startDate }} - {{ exp.current ? 'Present' : exp.endDate }}</p>
      </div>
      <div class="item-actions">
        <button class="btn-icon btn-edit" (click)="editExperience(exp)">
          <i class="fas fa-edit"></i>
        </button>
        <button class="btn-icon btn-delete" (click)="deleteExperience(exp._id)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>
    <p class="empty-message" *ngIf="experienceList.length === 0">No experience entries yet.</p>
  </div>
</div>
