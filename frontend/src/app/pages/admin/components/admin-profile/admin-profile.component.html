<div class="admin-section">
  <h2 class="section-title">Profile & Photo</h2>

  <div
    class="alert"
    *ngIf="message"
    [class.success]="messageType === 'success'"
    [class.error]="messageType === 'error'"
  >
    {{ message }}
  </div>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="admin-form">
    <div class="photo-section">
      <div class="photo-preview">
        <img *ngIf="previewUrl" [src]="previewUrl" alt="Profile Photo" />
        <div *ngIf="!previewUrl" class="photo-placeholder">
          <i class="fas fa-user"></i>
        </div>
      </div>
      <div class="photo-upload">
        <label for="photo" class="btn btn-secondary">
          <i class="fas fa-camera"></i>
          Choose Photo
        </label>
        <input type="file" id="photo" accept="image/*" (change)="onFileSelect($event)" hidden />
        <button
          *ngIf="selectedFile"
          type="button"
          class="btn btn-primary"
          (click)="onUploadPhoto()"
          [disabled]="isLoading"
        >
          <i class="fas fa-upload"></i>
          {{ isLoading ? 'Uploading...' : 'Change Photo' }}
        </button>
        <p class="upload-hint">Recommended: 400x400px, JPG or PNG</p>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" formControlName="name" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label for="title">Professional Title *</label>
        <input type="text" id="title" formControlName="title" placeholder="Full Stack Developer" />
      </div>
    </div>

    <div class="form-group">
      <label for="subtitle">Subtitle</label>
      <input
        type="text"
        id="subtitle"
        formControlName="subtitle"
        placeholder="Specializing in Web Development"
      />
    </div>

    <div class="form-group">
      <label for="tagline">Tagline</label>
      <textarea
        id="tagline"
        formControlName="tagline"
        rows="3"
        placeholder="A brief introduction about yourself"
      ></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid || isLoading">
        <i class="fas fa-save"></i>
        {{ isLoading ? 'Saving...' : 'Save Profile' }}
      </button>
    </div>
  </form>
</div>
