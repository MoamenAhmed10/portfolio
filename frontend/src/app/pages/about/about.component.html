<section class="about-page">
  <div class="page-container">
    <h1 class="page-title">About Me</h1>

    <div class="about-content">
      <div class="about-image" *ngIf="profile?.photo">
        <div class="image-wrapper">
          <img [src]="getPhotoUrl(profile?.photo)" [alt]="profile?.name" />
        </div>
      </div>

      <div class="about-text">
        <h2 class="about-title">{{ about?.title || 'Who I Am' }}</h2>
        <div class="about-description">
          <p>{{ about?.description || 'Add your about content through the admin dashboard.' }}</p>
        </div>

        <div
          class="about-highlights"
          *ngIf="about && about.highlights && about.highlights.length > 0"
        >
          <h3 class="highlights-title">Highlights</h3>
          <ul class="highlights-list">
            <li *ngFor="let highlight of about!.highlights" class="highlight-item">
              <i class="fas fa-check-circle"></i>
              <span>{{ highlight }}</span>
            </li>
          </ul>
        </div>

        <div class="about-actions">
          <a routerLink="/cv" class="btn btn-primary">
            <i class="fas fa-file-pdf"></i>
            View CV
          </a>
          <a routerLink="/contact" class="btn btn-secondary">
            <i class="fas fa-envelope"></i>
            Contact Me
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
