<section class="skills-page">
  <div class="page-container">
    <h1 class="page-title">Skills</h1>

    <div class="skills-content" *ngIf="skillGroups.length > 0; else noSkills">
      <div class="skill-category" *ngFor="let group of skillGroups">
        <div class="category-header">
          <div class="category-icon">
            <i [class]="group.icon"></i>
          </div>
          <h2 class="category-title">{{ group.category }}</h2>
        </div>

        <div class="skills-grid">
          <div class="skill-card" *ngFor="let skill of group.skills">
            <div class="skill-info">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-level">{{ skill.level }}%</span>
            </div>
            <div class="skill-bar">
              <div class="skill-progress" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <ng-template #noSkills>
      <div class="empty-state">
        <i class="fas fa-code"></i>
        <h3>No skills added yet</h3>
        <p>Add your skills through the admin dashboard.</p>
        <a routerLink="/admin" class="btn btn-primary">Go to Admin</a>
      </div>
    </ng-template>
  </div>
</section>
