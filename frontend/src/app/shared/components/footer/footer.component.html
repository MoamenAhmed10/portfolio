<footer class="footer">
  <div class="footer-container">
    <div class="footer-content">
      <div class="footer-section">
        <h3 class="footer-title">Portfolio</h3>
        <p class="footer-description">
          Building amazing digital experiences with modern technologies.
        </p>
      </div>

      <div class="footer-section">
        <h4 class="footer-subtitle">Quick Links</h4>
        <ul class="footer-links">
          <li><a routerLink="/">Home</a></li>
          <li><a routerLink="/about">About</a></li>
          <li><a routerLink="/projects">Projects</a></li>
          <li><a routerLink="/contact">Contact</a></li>
        </ul>
      </div>

      <div class="footer-section">
        <h4 class="footer-subtitle">Connect</h4>
        <div class="social-links">
          <a *ngIf="contact.github" [href]="contact.github" target="_blank" class="social-link">
            <i class="fab fa-github"></i>
          </a>
          <a *ngIf="contact.linkedin" [href]="contact.linkedin" target="_blank" class="social-link">
            <i class="fab fa-linkedin"></i>
          </a>
          <a *ngIf="contact.twitter" [href]="contact.twitter" target="_blank" class="social-link">
            <i class="fab fa-twitter"></i>
          </a>
          <a *ngIf="contact.email" [href]="'mailto:' + contact.email" class="social-link">
            <i class="fas fa-envelope"></i>
          </a>
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; {{ currentYear }} Portfolio. All rights reserved.</p>
    </div>
  </div>
</footer>
